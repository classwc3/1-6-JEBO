function quickDates_(inputId, periodId){
  var t=new Date(); t.setHours(0,0,0,0);
  var opts=[['오늘',fmtD_(t)],['내일',fmtD_(addDaysD_(t,1))],['모레',fmtD_(addDaysD_(t,2))],
            ['다음주 월',fmtD_(addDaysD_(t,(8-t.getDay())%7||7))]];
  return '<div class="quick-date-row">'+opts.map(function(o){
    return '<button type="button" class="qd-chip" onclick="setQuickDate_(\''+inputId+'\',\''+o[1]+'\',this)">'+o[0]+'</button>';
  }).join('')+'</div><div class="daypeek" id="'+inputId+'_peek" data-p="'+(periodId||'')+'"></div>';
}
function dayPeek_(id){
  var inp=$(id), el=$(id+'_peek'); if(!inp||!el) return;
  var d=inp.value, pid=el.getAttribute('data-p')||'';
  if(!d){ el.innerHTML=''; return; }
  var dow=parseD_(d).getDay(), hol=isHoliday_(d);
  if(hol){ el.innerHTML='<div class="dp-msg holi">'+esc_(md_(d))+' · '+esc_(hol)+'</div>'; return; }
  if(dow===0||dow===6){ el.innerHTML='<div class="dp-msg">'+esc_(md_(d))+' · 주말</div>'; return; }
  var dc=dayCells_(d);
  if(dc.noweek){ el.innerHTML='<div class="dp-msg">'+esc_(md_(d))+' · 시간표 없음</div>'; return; }
  var cells=dc.cells||[], n=0;
  for(var i=cells.length-1;i>=0;i--) if(cells[i]){ n=i+1; break; }
  var cur=(pid&&$(pid))?String($(pid).value||''):'', want=el.getAttribute('data-subj')||'';
  el.innerHTML='<div class="dp-row">'+cells.slice(0,n).map(function(c,i){
    var col=(c&&!c.cut)?subjColor_(c.subj):{bg:'#f1f4f9',fg:'#aeb8c6'};
    var lab=c?(c.cut?('단축'+(c.oSubj?'·'+c.oSubj:'')):c.subj):'–';
    var hit=want && c && !c.cut && (c.subj===want || c.subj.indexOf(want)===0 || want.indexOf(c.subj)===0);
    return '<button type="button" class="dp-p'+(cur===String(i+1)?' on':'')+(hit?' match':'')+'"'
      + (pid?' onclick="pickPeriod_(\''+id+'\','+(i+1)+')"':' tabindex="-1"')
      + ' style="background:'+col.bg+';color:'+col.fg+'"><b>'+(i+1)+'</b><span>'+esc_(lab)+'</span></button>';
  }).join('')+'</div>';
}
function pickPeriod_(id,p){
  var el=$(id+'_peek'), pid=el&&el.getAttribute('data-p');
  if(pid&&$(pid)) $(pid).value=String(p);
  dayPeek_(id);
}

/* =====================================================================
 * 평가계획 ZIP(HWP) 해석기 — 외부 라이브러리 없이 브라우저에서 동작
 *   ZIP 해제 → OLE(복합문서) 해석 → HWP 본문 압축 해제 → 표 복원
 *   → 과목 · 지도교사 · 정기시험 시기 · 수행평가(영역/만점/비율/시기/평가요소)
 *
 *   압축 해제는 직접 구현했다(브라우저 내장 해제기는 HWP 본문 끝 8바이트 때문에 실패한다).
 *   외부 라이브러리 · 브라우저 특정 기능 없이 동작한다.
 * ===================================================================*/
var HwpPlan = (function () {

  /* ── 공통 ─────────────────────────────────────────────────────── */
  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

  /* ── DEFLATE 해제 (RFC 1951) ──────────────────────────────────
     브라우저 내장 해제기는 압축 끝 뒤에 남은 바이트가 있으면 오류를 낸다.
     HWP 본문은 끝에 8바이트가 더 붙어 있어 전 과목이 실패했다.
     끝 표시를 만나면 멈추는 해제기를 직접 쓴다. */
  function inflateRawSync(src) {
    var pos = 0, bit = 0, bitCnt = 0, out = new Uint8Array(Math.max(1024, src.length * 4)), op = 0;
    function need(n) {
      while (bitCnt < n) {
        if (pos >= src.length) throw new Error('압축 데이터가 잘렸습니다.');
        bit |= src[pos++] << bitCnt; bitCnt += 8;
      }
    }
    function bits(n) { if (!n) return 0; need(n); var v = bit & ((1 << n) - 1); bit >>>= n; bitCnt -= n; return v; }
    function grow(n) {
      if (op + n <= out.length) return;
      var nb = new Uint8Array(Math.max(out.length * 2, op + n)); nb.set(out); out = nb;
    }
    function build(lens, n) {
      var count = new Uint16Array(16), offs = new Uint16Array(16), sym = new Uint16Array(n), i;
      for (i = 0; i < n; i++) count[lens[i]]++;
      count[0] = 0;
      for (i = 1; i < 16; i++) offs[i] = offs[i - 1] + count[i - 1];
      for (i = 0; i < n; i++) if (lens[i]) sym[offs[lens[i]]++] = i;
      return { count: count, sym: sym };
    }

      var raw = doc.read('BodyText/' + n);
      return compressed ? inflateRaw(raw) : raw;
    });
    return analyse(tablesOf(secs));
  }

  /** ZIP 하나 → [{file, subject, teachers, exams, tasks}] */
  function parseZip(arrayBuffer) {
    if (arrayBuffer instanceof Uint8Array) arrayBuffer = arrayBuffer.buffer.slice(arrayBuffer.byteOffset, arrayBuffer.byteOffset + arrayBuffer.length);
    var bytes = new Uint8Array(arrayBuffer);
    var entries = zipEntries(bytes).filter(function (e) { return /\.hwp$/i.test(e.name); });
    if (!entries.length) throw new Error('ZIP 안에 HWP 파일이 없습니다.');
    return entries.map(function (e) {
      try {
        var r = parseHwp(zipRead(e));
        r.file = e.name.replace(/^.*\//, '');
        if (!r.subject) r.subject = subjectFromFile(e.name);
        return r;
      } catch (err) {
        return { file: e.name.replace(/^.*\//, ''), subject: subjectFromFile(e.name), error: String(err && err.message || err), exams: [], tasks: [] };
      }
    });
  }

  return { parseZip: parseZip, parseHwp: parseHwp };
})();

          + '<input type="text" value="'+esc_(x.name)+'" oninput="STU['+i+'].name=this.value" aria-label="이름">'
          + '<input type="text" value="'+esc_(x.note||'')+'" placeholder="비고" oninput="STU['+i+'].note=this.value" aria-label="비고">'

function stuPaste_(){
  var lines=String($('stuPaste').value||'').split(/\n+/), out=[];
  lines.forEach(function(l){
    var m=l.trim().match(/^(\d+)[\s.,\t)번]*\s*(.+)$/);
    if(m) out.push({no:Number(m[1]),name:m[2].trim(),note:''});
    else if(l.trim()) out.push({no:out.length+1,name:l.trim(),note:''});
  });
  if(!out.length){ toast('붙여넣을 명단이 없습니다.'); return; }
  STU=out; drawStudents_(); toast(out.length+'명을 불러왔어요. 저장을 눌러주세요.');
}
function stuSave_(btn){
  var done=busy_(btn,'저장 중…');

    done();
    if(r&&r.ok){ toast(r.count+'명을 저장했습니다.'); refreshBoot_(); } else toast((r&&r.error)||'저장에 실패했습니다.');
  }).catch(function(){ done(); });
}

/* ── 시험범위 관리: 시험 하나 = 표 하나 ──────────────────────────── */
var EXA = { groups:[], subjects:[], teachers:{}, cur:'', rows:[], remove:[], exam:'' };
var EXAM_KINDS=['교과서','학습지','교과서·학습지','기타'];
function renderExamSection_(body){
  body.innerHTML='<div class="skel-bar"></div><div class="skel-bar"></div>';
  arun('adminListExams').then(function(r){
    if(!r||!r.ok){ body.innerHTML='<div class="banner warn">불러오지 못했습니다.</div>'; return; }
    EXA.groups=r.groups||[]; EXA.subjects=r.subjects||[]; EXA.teachers=r.teachers||{};
    var today=todayStr_();
    var up=EXA.groups.filter(function(g){ return !g.end || g.end>=today; });
    exaPick_(EXA.cur && EXA.groups.some(function(g){ return g.exam===EXA.cur; }) ? EXA.cur : ((up[0]||EXA.groups[0]||{}).exam || ''));
  }).catch(function(){ body.innerHTML='<div class="banner warn">불러오지 못했습니다.</div>'; });
}
function exaPick_(name){
  EXA.cur=name; EXA.remove=[];
  var g=EXA.groups.filter(function(x){ return x.exam===name; })[0];
  if(g){ EXA.exam=g.exam; EXA.rows=g.subjects.map(function(x){ return JSON.parse(JSON.stringify(x)); }); }
  else {
    /* 새 시험: 우리 반 교과를 미리 채운다 */
    var n=EXA.groups.length;
    EXA.exam=name || (/1차/.test((EXA.groups[n-1]||{}).exam||'')?'2차 정기시험':'1차 정기시험');
    EXA.rows=EXA.subjects.slice(0,12).map(function(s){ return { subject:s, date:'', period:'', kind:'교과서', pages:'', range:'', notice:'', teacher:'' }; });
  }
  drawExa_();
}
function drawExa_(){
  var body=$('adminBody'); if(!body) return;
  var chips=EXA.groups.map(function(g){ return '<button class="qd-chip'+(g.exam===EXA.cur?' on':'')+'" onclick="exaPick_(\''+jq_(g.exam)+'\')">'+esc_(g.exam)+'</button>'; }).join('')
    + '<button class="qd-chip'+(!EXA.cur?' on':'')+'" onclick="exaPick_(\'\')">+ 새 시험</button>';
  var h='<div class="quick-date-row" style="margin-bottom:16px">'+chips+'</div>'
    + '<div class="field"><label for="exaName">시험 이름</label><input type="text" id="exaName" list="exaNames" value="'+attrEsc_(EXA.exam)+'" oninput="EXA.exam=this.value">'
    + '<datalist id="exaNames"><option value="1차 정기시험"><option value="2차 정기시험"></datalist></div>';
  EXA.rows.forEach(function(x,i){
    var col=subjColor_(x.subject), auto=EXA.teachers[x.subject]||teacherOf_(x.subject)||'';
    h+='<div class="exa-row" id="exaR'+i+'">'
      + '<div class="exa-top"><span class="psubj" style="background:'+col.bg+';color:'+col.fg+'">'+esc_(x.subject)+'</span>'
      +   '<input class="exa-teach" value="'+attrEsc_(x.teacher||'')+'" placeholder="'+attrEsc_(auto||'선생님')+'" oninput="EXA.rows['+i+'].teacher=this.value" aria-label="선생님">'
      +   '<button class="ord-b" onclick="exaDel_('+i+')" aria-label="빼기">✕</button></div>'
      + '<div class="exa-grid">'
      +   '<label>시험일<input type="date" id="exa_d'+i+'" value="'+attrEsc_(x.date||'')+'" oninput="EXA.rows['+i+'].date=this.value"></label>'
      +   '<label>교시<input type="text" id="exa_p'+i+'" inputmode="numeric" value="'+attrEsc_(x.period||'')+'" oninput="EXA.rows['+i+'].period=this.value" placeholder="1"></label>'
      + '</div><div class="daypeek" id="exa_d'+i+'_peek" data-p="exa_p'+i+'" data-subj="'+attrEsc_(x.subject)+'"></div>'
      + '<div class="chiprow exa-kind">'+EXAM_KINDS.map(function(k){ return '<div class="chip'+(x.kind===k?' on':'')+'" onclick="exaKind_('+i+',\''+k+'\',this)">'+k+'</div>'; }).join('')+'</div>'
      + '<div class="exa-grid">'
      +   '<label>쪽수<input type="text" value="'+attrEsc_(x.pages||'')+'" placeholder="14~53, 60~111" oninput="EXA.rows['+i+'].pages=this.value"></label>'
      +   '<label class="wide">단원·범위<input type="text" value="'+attrEsc_(x.range||'')+'" placeholder="1. 네 마음이 궁금해 ~ 2단원" oninput="EXA.rows['+i+'].range=this.value"></label>'
      + '</div>'
      + '<details class="exa-n"'+(x.notice?' open':'')+'><summary>안내'+(x.notice?' ✓':'')+'</summary>'+mdEditor_('exa_n'+i, x.notice||'', '준비물 · 유의사항 · 사진이나 학습지 파일', 90)+'</details>'
      + '</div>';
  });
  var rest=EXA.subjects.filter(function(s){ return !EXA.rows.some(function(x){ return x.subject===s; }); });
  if(rest.length) h+='<div class="chiprow" style="margin:6px 0 18px">'+rest.map(function(s){ return '<div class="chip" onclick="exaAdd_(\''+jq_(s)+'\')">+ '+esc_(s)+'</div>'; }).join('')+'</div>';
  h+='<button class="submit-btn" onclick="exaSave_(this)">저장</button>'
    + (EXA.cur?'<button class="link-btn danger" onclick="exaDrop_()">'+esc_(EXA.cur)+' 지우기</button>':'');
  body.innerHTML=h;
  EXA.rows.forEach(function(x,i){ if(x.date) dayPeek_('exa_d'+i); });
}
function exaKind_(i,k,el){ EXA.rows[i].kind=k; Array.prototype.forEach.call(el.parentElement.children,function(c){ c.classList.toggle('on', c===el); }); }
function exaSync_(){ EXA.rows.forEach(function(x,i){ var ta=$('exa_n'+i); if(ta) x.notice=ta.value; }); }
function exaDel_(i){ exaSync_(); var x=EXA.rows.splice(i,1)[0]; if(x&&x.rowIndex) EXA.remove.push(x.rowIndex); drawExa_(); }
function exaAdd_(s){ exaSync_(); var last=EXA.rows[EXA.rows.length-1]||{}; EXA.rows.push({ subject:s, date:last.date||'', period:'', kind:'교과서', pages:'', range:'', notice:'', teacher:'' }); drawExa_(); }
function exaSave_(btn){
  exaSync_();
  var name=String(EXA.exam||'').trim(); if(!name){ toast('시험 이름을 넣어주세요.'); return; }
  var done=busy_(btn,'저장 중…');
  arun('adminSaveExamTable', { exam:name, oldExam:EXA.cur, rows:EXA.rows, remove:EXA.remove }).then(function(r){
    done();
    if(r&&r.ok){ toast(r.saved+'과목을 저장했습니다.'); EXA.cur=name; adminRefresh_(); }
    else toast((r&&r.error)||'저장하지 못했습니다.');
  }).catch(function(){ done(); });
}
function exaDrop_(){
  confirmBox(EXA.cur+'을(를) 지울까요?', function(){
    arun('adminDeleteExamGroup', EXA.cur).then(function(r){ if(r&&r.ok){ toast('지웠습니다.'); EXA.cur=''; adminRefresh_(); } });
  });
}

function loadDayTimes_(){

  arun('adminGetDayTimes', date).then(function(r){

    if(!r.periods.length){ editor.innerHTML='<div class="rank-empty">이 날짜에 해당하는 정규 교시 정보가 없습니다.</div>'; return; }
    var h='<div class="day-editor-list">';

       + '<div class="der-period">'+esc_(p.period)+(p.period!=='점심'?'교시':'')+'</div>'
       + '<div class="der-times"><input type="time" class="der-start" value="'+esc_(p.start)+'"><span>~</span><input type="time" class="der-end" value="'+esc_(p.end)+'"></div>'

    });

    editor.innerHTML=h;

function collectPeriods_(){

function loadDevices_(){
  arun('adminListDevices').then(function(r){
    if(!r||!r.ok){ var el=$('devList'); if(el) el.innerHTML='<div class="banner warn">'+esc_((r&&r.error)||'불러오지 못했습니다.')+'</div>'; return; }
    DEV_CACHE=r.items||[]; renderDevList_();
  }).catch(function(){ var el=$('devList'); if(el) el.innerHTML='<div class="banner warn">불러오지 못했습니다.</div>'; });

function renderDevList_(){
  var el=$('devList'); if(!el) return;
  if(!DEV_CACHE.length){ el.innerHTML='<div class="rank-empty">기록된 기기가 없습니다.</div>'; return; }
  var q=(($('devSearch')||{value:''}).value||'').trim().toLowerCase();
  var items=DEV_CACHE.filter(function(it){
    if(DEV_FILTER==='online'&&!it.online) return false;
    if(DEV_FILTER==='named'&&!it.name) return false;
    if(DEV_FILTER==='flag'&&!it.group&&!it.sharedWifi&&it.ipCount<3) return false;
    if(q && (it.name||'').toLowerCase().indexOf(q)<0 && it.deviceId.indexOf(q)<0) return false;
    return true;
  });
  if(!items.length){ el.innerHTML='<div class="rank-empty">조건에 맞는 기기가 없습니다.</div>'; return; }
  var h='';
  items.forEach(function(it){
    h+='<div class="admin-item'+(it.online?' online':'')+(it.group?' susp':'')+'">';
    h+='<div class="meta"><span><b>'+esc_(it.name||'(이름 없음)')+'</b></span>';
    if(it.online) h+='<span class="tag on">접속중</span>';
    if(it.ua) h+='<span class="tag ua">'+esc_(it.ua)+'</span>';
    if(it.sharedWifi) h+='<span class="tag wifi">같은 와이파이</span>';
    if(it.group) h+='<span class="tag grp">같은 IP·다른 이름</span>';
    if(it.sameDevice&&it.sameDevice.length) h+='<span class="tag same" title="'+esc_('지문이 같은 기기ID: '+it.sameDevice.join(', '))+'">같은 기기 추정 '+it.sameDevice.length+'</span>';
    h+='</div>';
    h+='<div class="body" style="font-size:11.5px;color:var(--faint)">기기 '+esc_(it.deviceId.slice(0,10))+'… · 제출 '+it.submits+'회 · 최근 '+esc_(it.last||'-')+'</div>';
    h+='<div class="foot2" style="gap:6px">'
     + '<select class="ip-status-sel" style="flex:1" onchange="changeDevStatus_('+it.rowIndex+',\''+jq_(it.deviceId)+'\',this)">'
     + [['허용','허용'],['관리자모드차단','관리자모드만 차단'],['기기차단','이 기기만 차단'],['전체차단','기기 + 같은 IP 차단']].map(function(s){ return '<option value="'+s[0]+'"'+(it.status===s[0]?' selected':'')+'>'+s[1]+'</option>'; }).join('')
     + '</select>'
     + '<button class="mini-btn" onclick="renameDev_('+it.rowIndex+',\''+jq_(it.deviceId)+'\',\''+jq_(it.name)+'\')">이름</button></div></div>';
  });
  el.innerHTML=h;

function changeDevStatus_(row, deviceId, sel){

function notifyDiag_(btn){

    var bad=[];

    if(!r.triggerInstalled) bad.push('발송 트리거가 없습니다 → 시트 메뉴 ⚙ → [자동 트리거 다시 설치]');

    if(r.triggerFresh===false) bad.push('트리거가 구버전입니다 → 5분 안에 자동으로 교체됩니다. 급하면 시트 메뉴 ⚙ → [자동 트리거 다시 설치]');
    if(r.tzSheet && r.tzScript && r.tzSheet!==r.tzScript) bad.push('시트 표준시('+r.tzSheet+')와 스크립트 표준시('+r.tzScript+')가 다릅니다 → 시트 메뉴 ⚙ → [표준시를 서울로 맞추기]');
    if(r.tzSheet && r.tzSheet.indexOf('Seoul')<0) bad.push('시트 표준시가 서울이 아닙니다('+r.tzSheet+') → 기록 시각이 어긋납니다.');
    var rows=[['설정 시각',r.time],['서버 현재시각',r.now],['오늘 요일',r.weekday],
              ['트리거',r.triggerInstalled?'설치됨':'없음'],['구독자',r.subscribers+'명'],
              ['오늘 발송',r.sentToday?'완료':'아직'],['최근 발송',r.lastSent],
              ['마지막 자동검사',r.lastCheck],['남은 메일 한도',r.quota+'통'],
              ['페이지 응답',r.lastPage||'-'],

              ['표준시',(r.tzSheet||'?')+' / '+(r.tzScript||'?')]];
    var h='<div class="diag">'+rows.map(function(x){
      return '<div class="dg-row"><span>'+esc_(x[0])+'</span><b>'+esc_(String(x[1]))+'</b></div>'; }).join('')+'</div>';
    if(bad.length) h+='<div class="banner warn" style="margin-top:10px">'+bad.map(esc_).join('<br>')+'</div>';
    else h+='<div class="banner ok" style="margin-top:10px">설정에 문제가 없습니다. 설정 시각이 지나면 15분 안에 발송됩니다.</div>';

      + '</div>';

</script>
<script>
/* =====================================================================
 * 첨부·미디어가 들어가는 본문 (공지 · 수행평가 안내 · 시험 안내)
 *   ![설명](drive:ID)          사진          ![설명](https://…)  외부 사진
 *   [[video:drive:ID]]         동영상        [[youtube:주소]]    유튜브
 *   [[file:drive:ID|이름|크기]] 파일(미리보기·다운로드)
 *   [[embed:https://…|높이]]   외부 페이지
 *   ```html:높이 … ```          HTML (격리된 창 — 앱 데이터에 접근 못 함)
 *   drive: = 링크 공유된 파일, dpriv: = 공유가 막혀 앱 서버를 거쳐 보여주는 파일
 * ===================================================================*/
function driveImg_(id){ return 'https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w1600'; }
function drivePreview_(id){ return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'; }
function driveDown_(id){ return 'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id); }
function ytId_(u){
  var m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/);
  return m?m[1]:'';
}
function fileIcon_(name){
  var e=String(name||'').split('.').pop().toLowerCase();
  if(/^(pdf)$/.test(e)) return '📕'; if(/^(hwp|hwpx|doc|docx)$/.test(e)) return '📘'; if(/^(xls|xlsx|csv)$/.test(e)) return '📗';
  if(/^(ppt|pptx)$/.test(e)) return '📙'; if(/^(png|jpe?g|gif|webp|heic)$/.test(e)) return '🖼'; if(/^(mp4|mov|webm|m4v)$/.test(e)) return '🎬';
  if(/^(mp3|m4a|wav)$/.test(e)) return '🎵'; if(/^(zip|7z|rar)$/.test(e)) return '🗜'; return '📄';
}
function sizeText_(n){ n=Number(n)||0; if(!n) return ''; if(n<1024*1024) return Math.max(1,Math.round(n/1024))+'KB'; return (n/1048576).toFixed(1)+'MB'; }
function attrEsc_(s){ return esc_(String(s==null?'':s)).replace(/"/g,'&quot;'); }

function richHtml_(src){
  var keep=[], s=String(src||'');
  function stash(html){ keep.push(html); return '\u0000'+(keep.length-1)+'\u0000'; }
  /* ```html:높이 … ``` → 격리된 창 */
  s=s.replace(/```html(?::(\d{2,4}))?\n?([\s\S]*?)```/g, function(m,h,code){
    var hh=Math.min(1600,Math.max(120,Number(h)||320));
    return stash('<iframe class="rc-html" sandbox="allow-scripts allow-popups allow-forms" style="height:'+hh+'px" srcdoc="'+attrEsc_(code)+'"></iframe>');
  });
  /* [[종류:값|…]] */
  s=s.replace(/\[\[(video|youtube|file|embed):([^\]\n]+)\]\]/g, function(m,kind,body){
    var p=body.split('|'), v=p[0].trim();
    var priv=/^dpriv:/.test(v), id=v.replace(/^(drive|dpriv):/,'');
    if(kind==='youtube'){ var y=ytId_(v); return y?stash('<div class="rc-media"><iframe src="https://www.youtube-nocookie.com/embed/'+y+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>'):''; }
    if(kind==='video'){
      if(priv) return stash('<div class="rc-media"><video controls preload="none" data-fid="'+attrEsc_(id)+'" data-kind="video"></video><button class="rc-load" onclick="privLoad_(this.previousElementSibling)">▶ 재생</button></div>');
      return stash('<div class="rc-media"><iframe src="'+drivePreview_(id)+'" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>');
    }
    if(kind==='embed'){
      if(!/^https:\/\//.test(v)) return '';
      var eh=Math.min(1600,Math.max(160,Number(p[1])||420));
      return stash('<iframe class="rc-embed" src="'+attrEsc_(v)+'" style="height:'+eh+'px" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" loading="lazy"></iframe>');
    }
    /* file */
    var name=p[1]||'첨부파일', size=sizeText_(p[2]);
    return stash('<div class="rc-file"><span class="rc-fi">'+fileIcon_(name)+'</span><span class="rc-fn"><b>'+esc_(name)+'</b>'+(size?'<small>'+size+'</small>':'')+'</span>'
      + '<button class="rc-fb" onclick="openViewer_(\''+jq_(id)+'\',\''+jq_(name)+'\','+(priv?1:0)+')">미리보기</button>'
      + (priv?'<button class="rc-fb pri" onclick="privDownload_(\''+jq_(id)+'\',\''+jq_(name)+'\')">받기</button>'
             :'<a class="rc-fb pri" href="'+driveDown_(id)+'" target="_blank" rel="noopener">받기</a>')+'</div>');
  });
  /* ![설명](주소) */
  s=s.replace(/!\[([^\]\n]*)\]\(((?:drive|dpriv):[A-Za-z0-9_-]+|https:\/\/[^)\s]+)\)/g, function(m,alt,u){
    if(/^dpriv:/.test(u)) return stash('<figure class="rc-img"><img alt="'+attrEsc_(alt)+'" data-fid="'+attrEsc_(u.slice(6))+'" data-kind="img" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" onclick="zoomImg_(this)">'+(alt?'<figcaption>'+esc_(alt)+'</figcaption>':'')+'</figure>');
    var url=/^drive:/.test(u)?driveImg_(u.slice(6)):u;
    return stash('<figure class="rc-img"><img alt="'+attrEsc_(alt)+'" src="'+attrEsc_(url)+'" loading="lazy" onclick="zoomImg_(this)">'+(alt?'<figcaption>'+esc_(alt)+'</figcaption>':'')+'</figure>');
  });
  /* 줄 하나에 유튜브 주소만 있으면 바로 재생 창으로 */
  s=s.replace(/^(https?:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)\/\S+)$/gm, function(m,u){ var y=ytId_(u); return y?stash('<div class="rc-media"><iframe src="https://www.youtube-nocookie.com/embed/'+y+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>'):m; });
  var t=mdToHtml_(s);
  t=t.replace(/<br>(\u0000\d+\u0000)/g,'$1').replace(/(\u0000\d+\u0000)<br>/g,'$1');
  t=t.replace(/\u0000(\d+)\u0000/g, function(m,i){ return keep[Number(i)]||''; });
  setTimeout(privScan_, 0);
  return '<div class="rich">'+t+'</div>';
}
/* 말풍선·목록용: 미디어 표시를 짧은 글자로 */
function mdPlain_(src){
  return String(src||'')
    .replace(/```html[\s\S]*?```/g,'[HTML]')
    .replace(/\[\[(video|youtube):[^\]]*\]\]/g,'[동영상]').replace(/\[\[embed:[^\]]*\]\]/g,'[페이지]')
    .replace(/\[\[file:[^|\]]*\|([^|\]]*)[^\]]*\]\]/g,'[파일: $1]').replace(/!\[([^\]]*)\]\([^)]*\)/g,'[사진]')
    .replace(/\*\*|~~|`|^#+\s*|^>\s?/gm,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').trim();
}

/* ── 공유가 막힌 파일: 앱 서버를 거쳐 받는다 ── */
var PRIV_URL = {};
function privFetch_(id){
  if(PRIV_URL[id]) return Promise.resolve(PRIV_URL[id]);
  return run('getFile', {id:id, deviceId:DEVICE_ID}).then(function(r){
    if(!r||!r.ok) throw new Error((r&&r.error)||'파일을 열 수 없습니다.');
    var bin=atob(r.data), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([arr],{type:r.type||'application/octet-stream'}));
    PRIV_URL[id]={url:url,type:r.type,name:r.name}; return PRIV_URL[id];
  });
}
function privScan_(){
  document.querySelectorAll('img[data-fid][data-kind="img"]:not([data-done])').forEach(function(img){
    img.setAttribute('data-done','1');
    privFetch_(img.getAttribute('data-fid')).then(function(f){ img.src=f.url; }).catch(function(){ img.alt='사진을 불러오지 못했습니다'; });
  });
}
function privLoad_(v){ var id=v.getAttribute('data-fid'); privFetch_(id).then(function(f){ v.src=f.url; v.play&&v.play(); var b=v.nextElementSibling; if(b) b.remove(); }).catch(function(e){ toast(e.message); }); }
function privDownload_(id,name){ privFetch_(id).then(function(f){ var a=document.createElement('a'); a.href=f.url; a.download=name||f.name||'file'; document.body.appendChild(a); a.click(); a.remove(); }).catch(function(e){ toast(e.message); }); }

/* ── 미리보기 창 ── */
function openViewer_(id,name,priv){
  var body=$('modalBody'), ext=String(name||'').split('.').pop().toLowerCase();
  var head='<div class="modal-head"><h3>'+esc_(name)+'</h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
  if(!priv){
    body.innerHTML=head+(/^(png|jpe?g|gif|webp)$/.test(ext)?'<img class="vw-img" src="'+driveImg_(id)+'">':'<iframe class="vw-frame" src="'+drivePreview_(id)+'" allow="autoplay; fullscreen"></iframe>')
      +'<a class="submit-btn" style="margin-top:12px;display:flex" href="'+driveDown_(id)+'" target="_blank" rel="noopener">받기</a>';
  } else {
    body.innerHTML=head+'<div class="skel-bar"></div>';
    privFetch_(id).then(function(f){
      var t=f.type||'';
      body.innerHTML=head+(/^image\//.test(t)?'<img class="vw-img" src="'+f.url+'">':(/^video\//.test(t)?'<video class="vw-img" controls src="'+f.url+'"></video>':'<iframe class="vw-frame" src="'+f.url+'"></iframe>'))
        +'<button class="submit-btn" style="margin-top:12px" onclick="privDownload_(\''+jq_(id)+'\',\''+jq_(name)+'\')">받기</button>';
    }).catch(function(e){ body.innerHTML=head+'<div class="banner warn">'+esc_(e.message)+'</div>'; });
  }
  MODAL_KIND=''; $('modalBg').classList.add('on'); lockScroll_();
  act('첨부 미리보기', name, '');
}
function zoomImg_(img){
  var body=$('modalBody');
  body.innerHTML='<div class="modal-head"><h3>'+esc_(img.alt||'사진')+'</h3><button class="modal-close" onclick="closeModal()">✕</button></div><img class="vw-img" src="'+img.src+'">';
  MODAL_KIND=''; $('modalBg').classList.add('on'); lockScroll_();
}

/* ── 편집기: 사진·동영상·파일 올리기, 유튜브·페이지·HTML 넣기 ── */
var MD_MAX_MB = 25;
function mdInsert_(id, text, selFrom, selLen){
  var ta=$(id); if(!ta) return;
  var a=ta.selectionStart||ta.value.length, b=ta.selectionEnd||a, v=ta.value;
  var pre=(a>0 && v.charAt(a-1)!=='\n')?'\n':'';
  ta.value=v.slice(0,a)+pre+text+v.slice(b);
  var at=a+pre.length;
  ta.focus(); if(selFrom!=null){ ta.selectionStart=at+selFrom; ta.selectionEnd=at+selFrom+(selLen||0); }
  mdSync_(id);
}
function mdPick_(id, kind){
  var inp=document.createElement('input'); inp.type='file';
  inp.accept = kind==='img'?'image/*':(kind==='video'?'video/*':'');
  inp.multiple = kind!=='video';
  inp.onchange=function(){ Array.prototype.forEach.call(inp.files, function(f){ mdUpload_(id, kind, f); }); };
  inp.click();
}
function mdUpload_(id, kind, f){
  if(f.size > MD_MAX_MB*1048576){ toast(MD_MAX_MB+'MB 보다 큰 파일은 올릴 수 없어요. 동영상은 유튜브 링크를 써주세요.'); return; }
  var tag='⏳ '+f.name+' 올리는 중…';
  mdInsert_(id, tag);
  var rd=new FileReader();
  rd.onload=function(){
    var b64=String(rd.result).split(',')[1]||'';
    arun('adminUpload', {name:f.name, type:f.type||'application/octet-stream', data:b64}).then(function(r){
      var ta=$(id); if(!ta) return;
      if(!r||!r.ok){ ta.value=ta.value.replace(tag,''); mdSync_(id); toast((r&&r.error)||'올리지 못했습니다.'); return; }
      var ref=(r.pub?'drive:':'dpriv:')+r.id, tok;
      if(kind==='img' || /^image\//.test(r.type)) tok='!['+f.name.replace(/\.[^.]+$/,'')+']('+ref+')';
      else if(kind==='video' || /^video\//.test(r.type)) tok='[[video:'+ref+']]';
      else tok='[[file:'+ref+'|'+r.name+'|'+r.size+']]';
      ta.value=ta.value.replace(tag, tok); mdSync_(id);
    }).catch(function(){ var ta=$(id); if(ta){ ta.value=ta.value.replace(tag,''); mdSync_(id); } toast('올리지 못했습니다.'); });
  };
  rd.readAsDataURL(f);
}

<script>
/* ── 준비물 띠 ─────────────────────────────────────────────────
   오늘·다음 등교일의 '준비물' 공지를 모아 시간표 위에 보여준다.
   체크는 각자 기기에만 저장(공유 안 함). */
function prepItems_(){
  var today=todayStr_(), out=[], seen={};
  // 다음 등교일 구하기
  var nx=parseD_(today); for(var g=0; g<10; g++){ nx.setDate(nx.getDate()+1); var w=nx.getDay(); if(w>0 && w<6 && !isHoliday_(fmtD_(nx))) break; }
  var nds=fmtD_(nx);
  (B.notices||[]).forEach(function(r){
    if(!/^(Y|1|true|준비물)$/i.test(String(r[3]||''))) return;
    var d=normD_(r[0]); if(d!==today && d!==nds) return;
    var key=d+'|'+String(r[2]); if(seen[key]) return; seen[key]=1;
    out.push({ when:d===today?'오늘':'다음', date:d, text:String(r[2]||'') });
  });
  return out;
}
function prepKey_(it){ return 'prep_'+it.date+'_'+hashStr_(it.text); }
function hashStr_(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function renderPrep_(){
  try{ updateBadge_(); }catch(eB){}
  var el=$('prepStrip'); if(!el) return;
  if(SEC_OFF.tt){ el.innerHTML=''; return; }   /* 시간표를 숨기면 준비물 띠도 숨김 */
  var items=prepItems_();
  if(!items.length){ el.innerHTML=''; el.style.display='none'; return; }
  el.style.display='';
  el.innerHTML='<div class="prep-wrap"><div class="prep-h">🎒 준비물</div>'
    + items.map(function(it){
        var k=prepKey_(it), done=stGet_(k)==='1';
        return '<label class="prep-row'+(done?' done':'')+'" onclick="prepToggle_(\''+jq_(k)+'\')">'
          + '<span class="prep-ck">'+(done?'✓':'')+'</span>'
          + '<span class="prep-when">'+it.when+'</span>'
          + '<span class="prep-tx">'+richHtml_(it.text)+'</span></label>';
      }).join('')+'</div>';
}
function prepToggle_(k){
  try{ updateBadge_(); }catch(eB){}
  var on=stGet_(k)==='1';
  if(on) stDel_(k); else stSet_(k,'1');
  renderPrep_();
  act('준비물 체크', on?'해제':'완료', '');
}

/* ── 투표·설문 (학생) ─────────────────────────────────────────── */
var POLL_SEL = {};   /* 질문ID → 고른 보기 index 배열 (제출 전) */
function renderPolls_(){
  var sec=$('pollSection'); if(!sec) return;
  var list=(B.polls||[]);
  if(SEC_OFF.poll || !list.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  var today=todayStr_();
  $('pollApp').innerHTML = list.map(function(p){
    var voted=!!p.voted, closed=!!p.closed || !!(p.due && p.due<today), canSee=!!p.results;
    var total=0; if(p.results) Object.keys(p.results).forEach(function(k){ total+=p.results[k]; });
    var sel = POLL_SEL[p.id] || (p.mine||[]);
    var h='<div class="poll-card" id="pollc_'+esc_(p.id)+'">'
      + '<div class="poll-q">'+esc_(p.q)+(p.anon?'<span class="poll-tag">익명</span>':'')+(p.multi?'<span class="poll-tag">복수</span>':'')+'</div>'
      + (p.desc?'<div class="poll-desc">'+richHtml_(p.desc)+'</div>':'');
    p.options.forEach(function(opt,i){
      var cnt=(p.results&&p.results[i])||0, pct=total?Math.round(cnt*100/total):0;
      var mine=sel.indexOf(i)>=0;
      if((voted || closed) && canSee){
        h+='<div class="poll-res'+(mine?' mine':'')+'"><div class="poll-bar" style="width:'+pct+'%"></div>'
          + '<span class="poll-opt">'+esc_(opt)+(mine?' ✓':'')+'</span><span class="poll-pct">'+pct+'% ('+cnt+')</span></div>';
      } else if(voted || closed){
        /* 결과 공개 전: 내가 고른 것만 표시 (집계는 서버가 아예 보내지 않음) */
        h+='<div class="poll-res nores'+(mine?' mine':'')+'"><span class="poll-opt">'+esc_(opt)+(mine?' ✓':'')+'</span></div>';
      } else {
        h+='<label class="poll-pick'+(mine?' on':'')+'" onclick="pollPick_(\''+jq_(p.id)+'\','+i+','+(p.multi?1:0)+')">'
          + '<span class="poll-box">'+(mine?'●':'')+'</span><span class="poll-opt">'+esc_(opt)+'</span></label>';
      }
    });
    var wait = p.reveal==='비공개' ? '결과는 공개되지 않아요' : (p.reveal==='마감 후' ? '결과는 마감 후'+(p.due?' ('+p.due.slice(5).replace('-','/')+')':'')+' 공개돼요' : '');
    if(voted && !closed) h+='<div class="poll-foot">투표했어요'+(canSee?' · 참여 '+p.voters+'명':'')+' <button class="poll-re" onclick="pollReset_(\''+jq_(p.id)+'\')">다시</button>'+(!canSee&&wait?'<span class="poll-wait">'+wait+'</span>':'')+'</div>';
    else if(closed) h+='<div class="poll-foot">마감됨'+(canSee?' · 참여 '+p.voters+'명':(wait?' · '+wait.replace('마감 후','').replace(/\(.*\)/,'').trim():''))+'</div>';
    else h+='<button class="submit-btn poll-submit" onclick="pollSubmit_(\''+jq_(p.id)+'\',this)">투표하기</button>';
    return h+'</div>';
  }).join('');
}
function pollPick_(id, i, multi){
  var cur=POLL_SEL[id] || [];
  if(multi){ var k=cur.indexOf(i); if(k>=0) cur.splice(k,1); else cur.push(i); }
  else cur=[i];
  POLL_SEL[id]=cur; renderPolls_();
}
function pollSubmit_(id, btn){
  var sel=POLL_SEL[id]||[];
  if(!sel.length){ toast('항목을 골라주세요.'); return; }
  if(!NOTIFY_STATE.name){ toast('먼저 설정에서 이름을 등록해주세요.'); openNotifyModal(); return; }
  var done=busy_(btn,'제출 중…');
  run('submitVote', { id:id, selection:sel, deviceId:DEVICE_ID, name:NOTIFY_STATE.name, ip:IP, ua:UA }).then(function(r){
    done();
    if(r&&r.ok){
      var p=(B.polls||[]).filter(function(x){ return x.id===id; })[0];
      if(p){ p.voted=true; p.mine=sel; p.results=r.results; p.voters=r.voters; }
      renderPolls_(); toast('투표했어요!');
    } else toast((r&&r.error)||'제출하지 못했습니다.');
  }).catch(function(){ done(); toast('제출 중 오류가 발생했습니다.'); });
}
function pollReset_(id){
  var p=(B.polls||[]).filter(function(x){ return x.id===id; })[0];
  if(p){ p.voted=false; POLL_SEL[id]=p.mine||[]; renderPolls_(); }
}
/* 수시 갱신 때 투표도 최신으로 */
function refreshPolls_(){
  run('getPolls', { deviceId:DEVICE_ID, name:NOTIFY_STATE.name||'' }).then(function(r){
    if(r&&r.ok){ B.polls=r.polls; renderPolls_(); }
  }).catch(function(){});
}

/* ── 투표·설문 (관리자) ──────────────────────────────────────── */

function pollStatus_(id, status){ arun('adminSetPollStatus', id, status).then(function(r){ if(r&&r.ok){ toast(({'숨김':'숨겼습니다.','마감':'마감했어요. 이제 투표할 수 없어요.','진행':'다시 받을게요.'})[status]||'바꿨습니다.'); adminRefresh_(); loadPollsAdmin_(); } }); }

<script>
/* ── 목록 공통 도구: 검색 · 필터 · 정렬 (모든 관리자 목록 + 학생 평가 목록) ──
   목록 영역이 화면에 나타나면 위에 도구 줄을 붙이고, 내용이 다시 그려질 때마다 다시 적용한다.
   각 탭의 그리기·저장 코드는 그대로 둔다. 선택은 목록마다 기억한다. */
var LT_LISTS = {
  perfAdminList: { key:'perf',   unit:'.pf-item',    subj:true, ph:'과목·과제 검색' },
  noticeList:    { key:'notice', unit:'.ntc-day',    ph:'공지 검색', filters:[['prep','준비물만',function(el){ return !!el.querySelector('.prep-badge'); }]] },
  adminList:     { key:'board',  unit:'.admin-item', ph:'내용·이름 검색' },
  ddList:        { key:'dday',   unit:'.dd-row',     ph:'디데이 검색' },
  bnList:        { key:'banner', unit:'.admin-item', ph:'배너 검색', filters:[['on','표시 중',function(el){ return !el.classList.contains('off'); }],['off','숨김',function(el){ return el.classList.contains('off'); }]] },
  pollAdminList: { key:'poll',   unit:'.pa-card',    ph:'투표 검색', filters:[['on','진행 중',function(el){ return !el.classList.contains('off'); }],['off','숨김',function(el){ return el.classList.contains('off'); }]] },
  perfApp:       { key:'sperf',  unit:'.perf-item',  subj:true, ph:'과목·평가 검색', student:true }
};
var LT_SORTS = [['date_desc','날짜 최신순'],['date_asc','날짜 빠른순'],['text','가나다순']];
var LT = (function(){ try{ return JSON.parse(localStorage.getItem('lt_state')||'{}'); }catch(e){ return {}; } })();
var LT_OBS = {}, LT_T = 0;
function ltSt_(key){ return LT[key] || (LT[key] = { q:'', f:'', sort:'date_desc' }); }
function ltSave_(){ try{ localStorage.setItem('lt_state', JSON.stringify(LT)); }catch(e){} }
function ltDate_(el){
  var d=el.getAttribute('data-date'); if(d) return d;
  var t=el.innerText||'', y=todayStr_().slice(0,4), m=t.match(/(20\d\d)[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=t.match(/(?:^|\D)(\d{1,2})[\/.](\d{1,2})(?:\D|$)/);
  return m ? y+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2) : '';
}
function ltUnits_(box, cfg){ return [].slice.call(box.querySelectorAll(cfg.unit)); }
function ltBarHtml_(id){
  var cfg=LT_LISTS[id], st=ltSt_(cfg.key), box=$(id), opts=[['','전체']];
  if(cfg.subj && box){
    var seen={}; ltUnits_(box,cfg).forEach(function(el){ var s=el.getAttribute('data-subj'); if(s && !seen[s]){ seen[s]=1; opts.push(['subj:'+s, s]); } });
  }
  (cfg.filters||[]).forEach(function(f){ opts.push([f[0], f[1]]); });
  return '<input class="lt-q" type="search" placeholder="'+esc_(cfg.ph||'검색')+'" value="'+esc_(st.q||'')+'" oninput="ltSet_(\''+id+'\',\'q\',this.value)">'
    + (opts.length>1?'<select class="lt-f" onchange="ltSet_(\''+id+'\',\'f\',this.value)">'+opts.map(function(o){ return '<option value="'+esc_(o[0])+'"'+(st.f===o[0]?' selected':'')+'>'+esc_(o[1])+'</option>'; }).join('')+'</select>':'')
    + '<select class="lt-s" onchange="ltSet_(\''+id+'\',\'sort\',this.value)">'+LT_SORTS.map(function(o){ return '<option value="'+o[0]+'"'+(st.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>';
}
function ltSet_(id, k, v){
  var cfg=LT_LISTS[id]; ltSt_(cfg.key)[k]=v; ltSave_();
  /* 학생 목록은 처음 4개만 보이므로, 찾거나 거를 때는 전부 펼친다 */
  if(cfg.student && (k==='q'||k==='f') && v && typeof PERF_ALL!=='undefined' && !PERF_ALL){ PERF_ALL=true; renderPerf_(); }
  clearTimeout(LT_T); LT_T=setTimeout(function(){ ltApply_(id); }, k==='q'?180:0);
}
function ltApply_(id){
  var cfg=LT_LISTS[id], box=$(id); if(!cfg||!box) return;
  var st=ltSt_(cfg.key), q=String(st.q||'').trim().toLowerCase(), units=ltUnits_(box,cfg), shown=0;
  var pred=null;
  if(st.f && st.f.indexOf('subj:')===0){ var sj=st.f.slice(5); pred=function(el){ return el.getAttribute('data-subj')===sj; }; }
  else if(st.f){ (cfg.filters||[]).forEach(function(f){ if(f[0]===st.f) pred=f[2]; }); }
  units.forEach(function(el){
    var ok=(!q || (el.innerText||'').toLowerCase().indexOf(q)>=0) && (!pred || pred(el));
    el.style.display = ok ? '' : 'none'; if(ok) shown++;
  });
  /* 정렬: 같은 부모 안에서만 (지난 공지처럼 나뉜 구역은 구역끼리) · 날짜 없는 항목은 맨 뒤 */
  var byParent=[];
  units.forEach(function(el){ var p=el.parentNode, g=byParent.filter(function(x){ return x.p===p; })[0]; if(!g){ g={p:p, a:[]}; byParent.push(g); } g.a.push(el); });
  byParent.forEach(function(g){
    var a=g.a.slice();
    if(st.sort==='text') a.sort(function(x,y){ return (x.innerText||'').localeCompare(y.innerText||'','ko'); });
    else a.sort(function(x,y){ var dx=ltDate_(x), dy=ltDate_(y); if(!dx&&!dy) return 0; if(!dx) return 1; if(!dy) return -1; return st.sort==='date_asc' ? (dx<dy?-1:dx>dy?1:0) : (dx<dy?1:dx>dy?-1:0); });
    var anchor=g.a[g.a.length-1].nextSibling;
    a.forEach(function(el){ g.p.insertBefore(el, anchor); });
  });
  var none=box.querySelector(':scope > .lt-none');
  if(units.length && !shown){ if(!none){ none=document.createElement('div'); none.className='lt-none empty-box'; box.appendChild(none); } none.textContent='찾는 항목이 없어요'; }
  else if(none) none.remove();
  if(LT_OBS[id]) LT_OBS[id].takeRecords();      /* 방금 내가 옮긴 것은 다시 반응하지 않게 */
}
function ltMount_(id){
  var cfg=LT_LISTS[id], box=$(id); if(!cfg||!box) return;
  var bar=box.previousElementSibling;
  if(!bar || !bar.classList.contains('lt-bar') || bar.getAttribute('data-for')!==id){
    bar=document.createElement('div'); bar.className='lt-bar'; bar.setAttribute('data-for', id);
    box.parentNode.insertBefore(bar, box);
  }
  if(document.activeElement && bar.contains(document.activeElement)){ ltApply_(id); return; }   /* 입력 중이면 도구 줄은 그대로 */
  bar.innerHTML=ltBarHtml_(id);
  if(LT_OBS[id] && LT_OBS[id].__box===box){ ltApply_(id); return; }
  if(LT_OBS[id]) LT_OBS[id].disconnect();
  var obs=new MutationObserver(function(){ ltMount_(id); });
  obs.__box=box; obs.observe(box, { childList:true }); LT_OBS[id]=obs;
  ltApply_(id);
}
/* 목록 영역이 새로 생기면(탭 이동 등) 자동으로 붙인다 */
try{
  new MutationObserver(function(){
    Object.keys(LT_LISTS).forEach(function(id){
      var box=$(id); if(!box) return;
      var bar=box.previousElementSibling;
      if(!bar || !bar.classList.contains('lt-bar') || bar.getAttribute('data-for')!==id || !LT_OBS[id] || LT_OBS[id].__box!==box) ltMount_(id);
    });
  }).observe(document.body, { childList:true, subtree:true });
}catch(eLT){}

</script>
<script>
/* ── 평가계획 전체 페이지 ('다가오는 평가' 옆 '모두') ──────────────────── */
var PLAN = { items:null, subj:'' };
function openPlan_(){
  VIEW='plan';
  $('mainView').style.display='none'; $('adminView').style.display='none'; $('planView').style.display='block';
  document.body.classList.remove('is-admin');
  window.scrollTo(0,0);
  act('평가계획 전체 보기', '', '');
  if(PLAN.items){ renderPlan_(); return; }
  $('planView').innerHTML=planHead_()+'<div class="skel-card"></div><div class="skel-card"></div>';
  run('getPerfPlan', { deviceId:DEVICE_ID }).then(function(r){
    PLAN.items=(r&&r.ok&&r.items)||[]; renderPlan_();
  }).catch(function(){ $('planView').innerHTML=planHead_()+'<div class="banner warn">불러오지 못했어요. 잠시 뒤 다시 열어주세요.</div>'; });
}
function closePlan_(){ $('planView').style.display='none'; switchView('main'); setTimeout(function(){ var s=$('perfSection'); if(s) s.scrollIntoView({block:'start'}); }, 50); }
function planHead_(){
  return '<div class="plan-top"><button class="btn icon" onclick="closePlan_()" aria-label="뒤로">◀</button><h2>평가계획 전체</h2></div>';
}
function planRatio_(x){ var n=parseFloat(String(x.ratio||'').replace('%','')); return isNaN(n)?0:n; }
function planWhenKey_(x){
  if(x.date) return x.date;
  var m=String(x.when||'').match(/(\d{1,2})\s*월(?:\s*(\d)\s*주)?/); if(!m) return '9999';
  var y=todayStr_().slice(0,4), mo=Number(m[1]); if(mo<3 && Number(todayStr_().slice(5,7))>8) y=String(Number(y)+1);
  return y+'-'+('0'+mo).slice(-2)+'-'+('0'+(m[2]?(Number(m[2])-1)*7+1:1)).slice(-2);
}
function renderPlan_(){
  var all=PLAN.items||[], el=$('planView'), today=todayStr_();
  if(!all.length){ el.innerHTML=planHead_()+'<div class="empty-box">아직 평가계획이 없어요</div>'; return; }
  var subs=[]; all.forEach(function(x){ if(subs.indexOf(x.subj)<0) subs.push(x.subj); });
  var list=PLAN.subj?all.filter(function(x){ return x.subj===PLAN.subj; }):all;
  var h=planHead_();
  h+='<div class="plan-chips"><button class="'+(PLAN.subj?'':'on')+'" onclick="PLAN.subj=\'\';renderPlan_()">전체</button>'
    + subs.map(function(s){ var c=subjColor_(s); return '<button class="'+(PLAN.subj===s?'on':'')+'" style="--c:'+c.fg+';--b:'+c.bg+'" onclick="PLAN.subj=\''+jq_(s)+'\';renderPlan_()">'+esc_(s)+'</button>'; }).join('')+'</div>';
  /* 전체 평가 일정 (확정일 → 평가시기 순) */
  var sch=list.slice().sort(function(a,b){ var ka=planWhenKey_(a), kb=planWhenKey_(b); return ka<kb?-1:ka>kb?1:0; });
  h+='<div class="plan-card"><div class="plan-h">📅 전체 평가 일정</div><div class="plan-sched">'
    + sch.map(function(x){
        var c=subjColor_(x.subj), dd=x.date?daysBetween_(today,x.date):null, past=x.date&&x.date<today;
        var when=x.date ? (x.date.slice(5).replace('-','/')+'('+dowKr_(x.date)+')'+(x.period?' '+esc_(x.period)+'교시':'')) : esc_(x.when||'미정');
        return '<div class="ps-row'+(past?' past':'')+'"><span class="ps-when'+(x.date?' fixed':'')+'">'+when+'</span>'
          + '<span class="psubj" style="background:'+c.bg+';color:'+c.fg+'">'+esc_(x.subj)+'</span>'
          + '<span class="ps-name">'+esc_(x.name)+'</span>'
          + (dd!==null&&dd>=0?'<span class="ps-dd">'+(dd===0?'D-Day':'D-'+dd)+'</span>':'')+'</span></div>';
      }).join('')+'</div></div>';
  /* 과목별: 반영비율 막대 + 항목 상세 */
  (PLAN.subj?[PLAN.subj]:subs).forEach(function(s){
    var items=all.filter(function(x){ return x.subj===s; }), c=subjColor_(s);
    var sum=items.reduce(function(a,x){ return a+planRatio_(x); },0), rest=Math.max(0,100-sum);
    var teach=(items[0]&&items[0].teachers)||'';
    h+='<div class="plan-card plan-subj"><div class="plan-sh"><span class="psubj big" style="background:'+c.bg+';color:'+c.fg+'">'+esc_(s)+'</span>'
      + (teach?'<span class="plan-teach">'+esc_(teach)+'</span>':'')+'<span class="plan-sum">수행평가 '+Math.round(sum*10)/10+'%</span></div>';
    h+='<div class="plan-stack">'+items.map(function(x){ var r=planRatio_(x); return r?'<i style="width:'+r+'%" title="'+esc_(x.name+' '+r+'%')+'"></i>':''; }).join('')
      + (rest>0?'<i class="rest" style="width:'+rest+'%" title="지필·기타 '+rest+'%"></i>':'')+'</div>';
    h+='<div class="plan-bars">'+items.map(function(x){ var r=planRatio_(x);
        return '<div class="pb-row"><span class="pb-n">'+esc_(x.name)+'</span><span class="pb-bar"><i style="width:'+Math.min(100,r)+'%;background:'+c.fg+'"></i></span><b>'+(r?r+'%':'-')+'</b></div>'; }).join('')
      + (rest>0?'<div class="pb-row rest"><span class="pb-n">지필·기타</span><span class="pb-bar"><i style="width:'+rest+'%"></i></span><b>'+Math.round(rest*10)/10+'%</b></div>':'')+'</div>';
    items.forEach(function(x,i){ h+=planItem_(x, s+'_'+i); });
    h+='</div>';
  });
  el.innerHTML=h;
}
function planItem_(x, key){
  var today=todayStr_(), dd=x.date?daysBetween_(today,x.date):null;
  var meta=[];
  if(x.ratio) meta.push('반영 '+esc_(String(x.ratio).replace(/%$/,''))+'%');
  if(x.max) meta.push('만점 '+esc_(x.max));
  if(x.essay) meta.push('논술형 '+esc_(x.essay));
  var when=x.date ? '<b class="pi-date">'+x.date.slice(5).replace('-','/')+'('+dowKr_(x.date)+')'+(x.period?' '+esc_(x.period)+'교시':'')+(dd!==null&&dd>=0?' · '+(dd===0?'D-Day':'D-'+dd):'')+'</b>' : '<span class="pi-when">'+esc_(x.when||'일정 미정')+'</span>';
  var r=x.rubric||{}, els=r.e||[], d='';
  if(x.task) d+='<div class="pm-sec"><div class="pm-h">수행과제</div><div class="pm-pre">'+esc_(x.task)+'</div></div>';
  if(x.methods) d+='<div class="pm-sec"><div class="pm-h">평가방법</div>'+String(x.methods).split(/\s*,\s*/).filter(String).map(function(m){ return '<span class="pm-tag">'+esc_(m)+'</span>'; }).join('')+'</div>';
  if(els.length){
    d+='<div class="pm-sec"><div class="pm-h">평가요소 · 상세 점수</div>'+els.map(function(e){
      return '<div class="pi-el"><div class="pi-elh"><span>'+esc_(String(e.n||'').replace(/^[•·\s]+/,''))+'</span>'+(e.p?'<b>'+e.p+'점</b>':'')+'</div>'
        + ((e.l||[]).length?'<table class="pi-lv">'+e.l.map(function(l){ return '<tr><th>'+esc_(String(l[0]==null?'':l[0]))+(/\d$/.test(String(l[0]))?'점':'')+'</th><td>'+esc_(l[1])+'</td></tr>'; }).join('')+'</table>':'')+'</div>';
    }).join('')+'</div>';
  }
  if(x.base || (r.d||[]).length) d+='<div class="pm-sec"><div class="pm-h">기본점수</div>'+(x.base?'<p class="pm-base">'+esc_(x.base)+'점</p>':'')
    + ((r.d||[]).length?'<ul class="pm-list">'+r.d.map(function(t){ return '<li>'+esc_(t)+'</li>'; }).join('')+'</ul>':'')+'</div>';
  if(x.notes) d+='<div class="pm-sec"><div class="pm-h">유의사항</div><div class="pm-pre">'+esc_(x.notes)+'</div></div>';
  if(x.standards) d+='<div class="pm-sec"><div class="pm-h">성취기준</div><div class="pm-pre">'+esc_(x.standards)+'</div></div>';
  if(x.notice) d+='<div class="pm-sec pm-notice"><div class="pm-h">안내</div>'+richHtml_(x.notice)+'</div>';
  return '<details class="plan-item"><summary><div class="pi-top"><span class="pi-name">'+esc_(x.name)+'</span>'+when+'</div>'
    + (meta.length?'<div class="pi-meta">'+meta.join(' · ')+'</div>':'')+'</summary>'
    + (d?'<div class="pi-body">'+d+'</div>':'<div class="pi-body"><div class="pm-h">상세 내용이 없어요</div></div>')+'</details>';
}
function daysBetween_(a,b){ return Math.round((parseD_(b).getTime()-parseD_(a).getTime())/86400000); }

</script>
<script>
/* ── 관리자 첫 화면: 요약 ───────────────────────────────────────── */
function renderHomeSection_(body, force){

    + '<div class="home-grid" id="homeGrid">'+[1,2,3,4,5,6].map(function(){ return '<div class="home-card"><div class="skel-bar"></div><div class="skel-bar"></div></div>'; }).join('')+'</div>';
  arun('adminSummary', !!force).then(function(r){
    var g=$('homeGrid'); if(!g) return;

    var d=r.dev||{};
    h+=card('device','🖥','접속', (d.online||0)+'대 <small>지금</small>', '오늘 '+(d.today||0)+'대 · 전체 '+(d.total||0)+'대'+(d.blocked?' · 차단 '+d.blocked:'')+(d.noIp?'<br>오늘 IP 없는 기기 '+d.noIp+'대':''), false);
    var soon=r.soon||[];
    h+=card('perf','📝','3일 안에 평가', soon.length+'개', soon.slice(0,3).map(function(x){ return esc_(x.subj)+' '+x.date.slice(5).replace('-','/')+(x.period?' '+esc_(x.period)+'교시':''); }).join('<br>')+(r.todo?'<br>날짜 정할 평가 '+r.todo+'개':''), false);
    var c=r.comci||{};
    h+=card('system','📅','시간표 연결', c.live?'정상':'확인 필요', '마지막 성공 '+esc_(c.last||'-')+'<br>자동 조회 '+(c.auto?'켜짐':'꺼짐'), !c.live);
    var m=r.mail;
    if(m) h+=card('system','✉','아침 메일', m.sentToday?'오늘 보냄':'아직', '받는 사람 '+m.subs+'명'+(m.last?'<br>마지막 '+esc_(String(m.last).slice(0,16)):''), !m.sentToday && new Date().getHours()>=8);
    var pl=r.polls||[];
    h+='<button class="home-card wide" onclick="adminGo_(\'poll\')"><div class="hc-t">🗳 투표 참여</div>'
      + (pl.length? pl.map(function(x){ var rate=x.rate==null?0:x.rate;
          return '<div class="hc-poll"><span>'+esc_(x.q)+(x.closed?' <small>(마감)</small>':'')+'</span><span class="hc-bar"><i style="width:'+Math.min(100,rate)+'%"></i></span><b>'+x.voters+(x.students?'/'+x.students:'')+'</b></div>'; }).join('')
        : '<div class="hc-sub">진행 중인 투표가 없어요</div>')+'</button>';
    g.innerHTML=h;
  }).catch(function(){ var g=$('homeGrid'); if(g) g.innerHTML='<div class="banner warn">요약을 불러오지 못했어요.</div>'; });
}
function adminGo_(sec){ ADMIN_SECTION=sec; LAST_ADMIN_SECTION=''; try{ renderAdminShell_(); }catch(e){ renderAdminBody_(); } window.scrollTo(0,0); }

</script>

<script>
/* ── 홈 화면 아이콘 숫자 배지: 내일까지 챙길 것 ─────────────────────
   체크 안 한 준비물 + 오늘·다음 등교일 수행평가 + 그날 시험 과목 + 오늘 시간표 변동.
   숫자는 바깥 페이지(1-6.웹.한국)가 아이콘에 단다 (홈 화면에 설치한 경우에만 보임). */
var BADGE_T=0, BADGE_LAST=-1;
function updateBadge_(){
  clearTimeout(BADGE_T);
  BADGE_T=setTimeout(function(){
    try{
      if(BLOCKED) return;
      var today=todayStr_(), n=0;
      var nx=parseD_(today); for(var g=0; g<10; g++){ nx.setDate(nx.getDate()+1); var w=nx.getDay(); if(w>0 && w<6 && !isHoliday_(fmtD_(nx))) break; }
      var nds=fmtD_(nx);
      try{ prepItems_().forEach(function(it){ if(stGet_(prepKey_(it))!=='1') n++; }); }catch(e1){}
      (B.perf||[]).forEach(function(x){ if(x.date===today || x.date===nds) n++; });
      (B.examRanges||[]).forEach(function(g2){ (g2.subjects||[]).forEach(function(x){ if(x.date===today || x.date===nds) n++; }); });
      try{ var wk=weekForDate_(today), dw=parseD_(today).getDay()-1;
        if(wk && dw>=0 && dw<5) ((wk.chg||[])[dw]||[]).forEach(function(c){ if(c && c.changed) n++; }); }catch(e2){}
      if(n===BADGE_LAST) return; BADGE_LAST=n;
      window.top.postMessage({ c16:'badge', n:n }, '*');
    }catch(e){}
  }, 900);
}
</script>
