<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>1학년 6반 건의 서비스</title>
  <meta name="description" content="1학년 6반 건의 서비스입니다.">
  <link rel="canonical" href="https://1-6.웹.한국/">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://1-6.웹.한국/">
  <meta property="og:title" content="1학년 6반 건의 서비스">
  <meta property="og:description" content="1학년 6반 건의 서비스입니다.">
  <meta property="og:image" content="https://i.imgur.com/Ooev1wG.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" href="https://i.imgur.com/Ooev1wG.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/Ooev1wG.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#EFF6FF; }
    #boot{ position:fixed; inset:0; display:flex; flex-direction:column; gap:18px;
      align-items:center; justify-content:center; background:#EFF6FF; z-index:3;
      transition:opacity .4s, visibility .4s; font-family:system-ui,-apple-system,sans-serif; }
    #boot.hide{ opacity:0; visibility:hidden; pointer-events:none; }
    #boot .sp{ width:40px; height:40px; border:3px solid #DBEAFE; border-top-color:#2563EB;
      border-radius:50%; animation:s .8s linear infinite; }
    @keyframes s{ to{ transform:rotate(360deg); } }
    iframe{ position:fixed; inset:0; width:100%; height:100%; border:0; z-index:2; background:#fff; } to{ left:100%; } }
    #inappTip{ position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:20; display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:#0f1729; color:#fff; font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.2); }
    #inappTip span{ flex:1; line-height:1.4; }
    #inappTip button{ border:0; border-radius:10px; padding:8px 11px; font-weight:800; font-size:13px; cursor:pointer; font-family:inherit; }
    #inappTipGo{ background:#2563EB; color:#fff; }
    #inappTipX{ background:transparent; color:#cbd5e1; }
    #inapp{ position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center;
      justify-content:center; gap:14px; padding:28px; text-align:center; background:#EFF6FF;
      font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; color:#0f1729; }
    #inapp .ic{ font-size:44px; }
    #inapp h2{ margin:0; font-size:19px; }
    #inapp p{ margin:0; font-size:14px; line-height:1.7; color:#64748b; }
    #inapp button{ border:0; border-radius:14px; padding:14px 22px; font-size:15px; font-weight:800;
      cursor:pointer; min-width:240px; font-family:inherit; }
    #inapp .go{ background:#2563EB; color:#fff; }
    #inapp .stay{ background:transparent; color:#94a3b8; font-weight:700; font-size:13px; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="sp"></div>
  </div>
  <div id="inapp">
    <div class="ic">🧭</div>
    <h2>다른 브라우저에서 열어주세요</h2>
    <p id="inappMsg">이 앱 안의 브라우저에서는 일부 기능이 제대로 동작하지 않아요.<br>크롬이나 사파리에서 열면 훨씬 빠르고 안정적이에요.</p>
    <button class="go" id="inappGo">외부 브라우저로 열기</button>
    <button class="stay" id="inappStay">그냥 여기서 볼게요</button>
  </div>
  <iframe
    id="site"
    title="1학년 6반 건의 서비스"
    allow="clipboard-write; clipboard-read"
    loading="eager"></iframe>
  <script>
    var APP = 'https://script.google.com/macros/s/AKfycbwFKU9x3iXDvTgPNUMujRM33Hr6mRi8EBthLLqMn_ygWfemzhtmVrwsRKJmx7D84ia24g/exec';
    var boot = document.getElementById('boot');
    var frame = document.getElementById('site');
    var done = false;

    /* 기기ID 세 번째 보관소: IndexedDB (localStorage·쿠키가 지워져도 남아 있으면 되살린다) */
    function idb(cb){ try { var rq = indexedDB.open('c16', 1); rq.onupgradeneeded = function(){ rq.result.createObjectStore('kv'); };
      rq.onsuccess = function(){ cb(rq.result); }; rq.onerror = function(){}; } catch (e) {} }
    function idbSave(v){ idb(function(db){ try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, 'dev'); } catch (e) {} }); }
    function idbLoad(cb){ var done = false; setTimeout(function(){ if (!done) { done = true; cb(''); } }, 400);
      idb(function(db){ try { var g = db.transaction('kv').objectStore('kv').get('dev'); g.onsuccess = function(){ if (!done) { done = true; cb(String(g.result || '')); } }; } catch (e) { if (!done) { done = true; cb(''); } } }); }
    function deviceId(){
      var K = 'c16_dev', v = '';
      try { v = localStorage.getItem(K) || ''; } catch (e) {}
      if (!v) { var m = document.cookie.match(/(?:^|;\s*)c16_dev=([A-Za-z0-9_-]+)/); if (m) v = m[1]; }
      if (!/^[A-Za-z0-9_-]{6,64}$/.test(v)) {
        var r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, '')
              : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
        v = 'd' + r.slice(0, 23);
      }
      try { localStorage.setItem(K, v); } catch (e) {}
      try { document.cookie = 'c16_dev=' + v + ';path=/;max-age=63072000;SameSite=Lax;Secure'; } catch (e) {}
      idbSave(v);
      return v;
    }

    function hideBoot(){
      if (done) return;
      done = true;
      boot.classList.add('hide');
      setTimeout(function(){ if (boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 400);
    }

    var MY_IP = '';
    try { MY_IP = sessionStorage.getItem('c16_ip') || ''; } catch (e) {}
    function fetchIP(retry){
      /* 부모(1차 도메인)에서 IP 를 받는다. 막히는 곳이 있어 여러 곳에 차례로 묻는다. */
      var srcs = [
        ['https://api.ipify.org?format=json', 'json'], ['https://api64.ipify.org?format=json', 'json'],
        ['https://ipapi.co/json/', 'json'], ['https://ipinfo.io/json', 'json'],
        ['https://icanhazip.com/', 'text'], ['https://www.cloudflare.com/cdn-cgi/trace', 'trace']
      ];
      var k = 0;
      function next(){
        if (MY_IP) return;
        if (k >= srcs.length) { if (!retry) setTimeout(function(){ fetchIP(true); }, 8000); return; }
        var s = srcs[k++];
        var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var tm = setTimeout(function(){ try { ctl && ctl.abort(); } catch (e) {} }, 3500);
        fetch(s[0], { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (r) { return r.text(); }).then(function (t) {
          clearTimeout(tm);
          var ip = '';
          if (s[1] === 'json') { try { var j = JSON.parse(t); ip = j.ip || j.query || ''; } catch (e) {} }
          else if (s[1] === 'trace') { var m = t.match(/^ip=(.+)$/m); ip = m ? m[1].trim() : ''; }
          else ip = String(t || '').trim();
          if (/^[0-9a-fA-F:.]{3,45}$/.test(ip)) {
            MY_IP = ip; try { sessionStorage.setItem('c16_ip', MY_IP); } catch (e) {}
            sendDev();
          } else next();
        }).catch(function () { clearTimeout(tm); next(); });
      }
      next();
    }
    function sendDev(){
      try { frame.contentWindow.postMessage({ c16: 'dev', id: deviceId(), ip: MY_IP || '' }, '*'); } catch (e) {}
    }
    function start(){
      frame.addEventListener('load', function(){ hideBoot(); sendDev(); });
      frame.src = APP + '?d=' + encodeURIComponent(deviceId()) + (MY_IP ? '&ip=' + encodeURIComponent(MY_IP) : '');
      setTimeout(hideBoot, 12000);
      fetchIP();
    }

    var ua = navigator.userAgent || '';
    var isKakao = /KAKAOTALK/i.test(ua);
    var isInApp = isKakao || /Instagram|FBAN|FBAV|NAVER\(inapp|Line\/|everytimeApp|DaumApps/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    function openExternal(){
      var url = location.href;
      if (isKakao) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
      if (/Line\//i.test(ua)) { location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return; }
      if (isAndroid) {
        location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        return;
      }
      document.getElementById('inappMsg').innerHTML = '오른쪽 위 <b>⋯</b> 또는 <b>공유</b> 버튼을 눌러<br><b>Safari로 열기</b>를 선택해주세요.';
    }

    var stayed = false;
    try { stayed = sessionStorage.getItem('c16_stay') === '1'; } catch (e) {}

    /* 카카오톡 등 앱 안 브라우저: 앱은 그대로 불러온다(기기·IP 기록). 안내는 화면을 막지 않는 위쪽 띠로. */
    (function(){
      var has = ''; try { has = localStorage.getItem('c16_dev') || ''; } catch (e) {}
      if (!has && !/c16_dev=/.test(document.cookie)) {
        idbLoad(function(v){
          if (/^[A-Za-z0-9_-]{6,64}$/.test(v)) { try { localStorage.setItem('c16_dev', v); } catch (e) {} try { document.cookie = 'c16_dev=' + v + ';path=/;max-age=63072000;SameSite=Lax;Secure'; } catch (e2) {} }
          start();
        });
      } else start();
    })();
    if (isInApp && !stayed) {
      var tip = document.createElement('div');
      tip.id = 'inappTip';
      tip.innerHTML = '<span>' + (isKakao ? '카카오톡' : '앱') + ' 안에서는 일부 기능이 제한될 수 있어요</span>'
        + '<button id="inappTipGo">브라우저로 열기</button><button id="inappTipX" aria-label="닫기">✕</button>';
      document.body.appendChild(tip);
      document.getElementById('inappTipGo').onclick = openExternal;
      document.getElementById('inappTipX').onclick = function(){
        try { sessionStorage.setItem('c16_stay', '1'); } catch (e) {}
        tip.remove();
      };
    }

    var lastReload = 0;
    window.addEventListener('message', function(e){
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (x) {}
      if (!/(\.googleusercontent\.com|^script\.google\.com)$/.test(host)) return;
      var d = e.data || {};
      if (d.c16 === 'ready') { hideBoot(); sendDev(); return; }
      if (d.c16 !== 'reload') return;
      /* 받았다고 먼저 답한다 → 앱이 바깥 창(이 페이지)을 다른 주소로 바꾸지 않는다 */
      try { e.source && e.source.postMessage({ c16: 'reloading' }, '*'); } catch (x2) {}
      if (Date.now() - lastReload < 15000) return;
      lastReload = Date.now();
      frame.src = APP + '?d=' + encodeURIComponent(deviceId()) + (d.fresh ? '&fresh=1' : '') + '&_r=' + Date.now();
    });

  </script>
</body>
</html>
